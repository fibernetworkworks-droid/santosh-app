# Hoola PC - the coworker's own cloud computer (Phase 1: one container on the Hoola VPS).
#
# First run (pairing): create a 6-digit code in the Hoola app (Mera PC > naya PC / pair), then:
#   docker exec -i hoola-pc sh -c 'echo CODE > /data/pair_code'
# The agent pairs once and stores its token in the volume - later restarts need nothing.
#
# The vps-ops workflow jobs (pc_deploy / pc_pair / pc_logs) do all of this on the VPS.
#
# v0.836 HOOLA PC TEAM: more Hoola PCs = more agents working at the same time (one agent per PC).
#   docker compose --profile team up -d        -> Hoola PC + Hoola PC 2 (each pairs once, its own volume)
#   vps-ops pc_deploy with lines = 1..4         -> the same, any team size; pc_pair lines = 2-CODE pairs PC 2
# Each PC may use up to 2.5 GB of RAM: an 8 GB server fits about 2.
# v0.885 HOOLA PC POOL: these PCs serve EVERY Hoola user one at a time (her own encrypted folder on the PC), so more
# PCs = more users served at once; a user waits in a queue when all are busy.
services:
  hoola-pc:
    build: .
    image: hoola-pc:latest
    container_name: hoola-pc
    restart: unless-stopped
    mem_limit: 2500m   # v1.2.0: real Chrome + heavy pages need headroom (VPS has 8 GB, 3 GB free)
    environment:
      # public URL, same path every desktop uses (the 172.18.0.1 bridge is firewall-dropped
      # on this VPS - v0.195 lesson: the pair POST sat in silent timeout on the bridge path)
      HOOLA_SERVER: https://hoola.ainewtika.com
      HOOLA_PC_NAME: Hoola PC
    volumes:
      - hoola-pc-data:/data
  hoola-pc-2:
    profiles: ["team"]
    build: .
    image: hoola-pc:latest
    container_name: hoola-pc-2
    restart: unless-stopped
    mem_limit: 2500m
    environment:
      HOOLA_SERVER: https://hoola.ainewtika.com
      HOOLA_PC_NAME: Hoola PC 2
    volumes:
      - hoola-pc-2-data:/data
volumes:
  hoola-pc-data:
  hoola-pc-2-data:
