<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hoola Work Theatre</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Sora:wght@700&amp;display=swap">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<script src="../santosh3d/three.min.js"></script>
<script src="../santosh3d/avatar.js"></script>
<script src="../santosh3d/looks.js"></script>
<script src="theatre.js"></script>
<script>
(function () {
  const post = (m) => { try { window.TheatreBridge && TheatreBridge.postMessage(m); } catch (e) {} };
  if (!window.THREE || !window.HoolaTheatre) { post('nogl'); return; }
  try { const c = document.createElement('canvas'); if (!(c.getContext('webgl2') || c.getContext('webgl'))) { post('nogl'); return; } }
  catch (e) { post('nogl'); return; }
  let cur = null, canvas = null, last = null;
  function show(scene) {
    if (cur && cur.name === scene) return;
    if (cur) cur.dispose();
    if (canvas) canvas.remove();
    canvas = document.createElement('canvas'); canvas.setAttribute('aria-hidden', 'true');
    document.body.appendChild(canvas);
    cur = HoolaTheatre.mount(canvas, scene);
    if (cur.failed) { post('nogl'); return; }
  }
  // called by the app: theatre.set({scene, phase, label, error, data}) — one real tool call
  window.theatre = {
    set(ev) {
      if (!ev) return;
      show(ev.scene || 'work');
      last = ev;
      cur && cur.set({ phase: ev.phase || 'start', label: ev.label || '', error: ev.error || '', data: ev.data || {} });
    },
    pause(on) { cur && cur.pause && cur.pause(on); },
    clear() { if (cur) cur.dispose(); cur = null; if (canvas) canvas.remove(); canvas = null; },
    // the owner's avatar look: '' = Santosh, f001..f100 = female looks (rebuilds the current scene)
    look(id) {
      const l = (window.HOOLA_LOOKS || []).find(x => x.id === id) || null;
      if ((window.HOOLA_LOOK || null) === l) return;
      window.HOOLA_LOOK = l;
      if (cur) { const n = cur.name; cur.dispose(); cur = null; if (canvas) canvas.remove(); canvas = null; show(n); if (last) cur && cur.set({ phase: last.phase || 'start', label: last.label || '', error: last.error || '', data: last.data || {} }); }
    }
  };
  post('ready');
})();
</script>
</body>
</html>
