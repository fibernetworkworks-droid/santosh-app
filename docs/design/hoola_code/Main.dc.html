<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1C1B1A}
a{color:#B7A9FF}a:hover{color:#D3C9FF}
.nav{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:8px;color:#E8E5DE;font-size:14px;text-decoration:none;background:none;border:0;width:100%;font-family:inherit;cursor:pointer;text-align:left}

.rec:hover{background:#26241F}
.rec span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;border:0;background:none;color:#D9D6CE;font:500 13px 'Schibsted Grotesk',sans-serif;cursor:pointer}
.chip:hover{background:#2A2825}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column;">

    <svg width="56" height="56" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#9C88FF"></circle><path d="M8 7v10M16 7v10M8 12h8" stroke="#14102B" stroke-width="2.4" stroke-linecap="round" fill="none"></path></svg>
    <h1 style="margin: 0; font-family: Literata, serif; font-weight: 400; font-size: 34px; color: #F3F1EC;">Ready when you are</h1>
    <div style="width: 300px; border: 1px solid #34322F; border-radius: 12px; background: #211F1D; overflow: hidden;">
      <div style="display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 14px; font-size: 14px;"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .6-7.9A6 6 0 0 0 6.6 9 4.5 4.5 0 0 0 7 18z"></path></svg><span style="flex: 1;">Default</span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></div>
      <a href="EnvMenu.dc.html" style="display: flex; align-items: center; height: 40px; padding: 0 14px; border-top: 1px solid #2E2C29; color: #D9D6CE; text-decoration: none; font-size: 14px;">Choose environment<svg width="0.9em" height="0.9em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; vertical-align: -0.125em; margin-left: 3px;"><path d="M6 9l6 6 6-6"></path></svg></a>
    </div>
    <p style="margin: 0; max-width: 460px; text-align: center; font-size: 13px; line-height: 1.5; color: #9C9890;">Hoola works on its own branch in a cloud environment, runs your tests and opens a pull request. Nothing is merged without you.</p>
  </div>

  <div style="padding: 0 24px 22px; display: flex; justify-content: center;">
    <div style="width: 100%; max-width: 820px; display: flex; flex-direction: column; gap: 6px;">
      <form style="display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 6px 8px 6px 10px; border: 1px solid #3A3835; border-radius: 16px; background: #262523;">
        <button type="button" class="chip" aria-label="Add files, pictures or a command" style="width: 34px; padding: 0; justify-content: center;"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
        <label for="ask" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Describe a task</label>
        <input id="ask" placeholder="Describe a task or ask a question" style="flex: 1; min-width: 0; height: 36px; border: 0; outline: none; background: none; color: #F3F1EC; font: 15px 'Schibsted Grotesk', sans-serif;">
        <button type="button" class="chip" aria-label="Hold to talk" style="width: 34px; padding: 0; justify-content: center;"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></button>
      </form>
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 2px;">
        <a class="chip" href="EnvMenu.dc.html" style="text-decoration: none;"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .6-7.9A6 6 0 0 0 6.6 9 4.5 4.5 0 0 0 7 18z"></path></svg>Default<svg width="0.9em" height="0.9em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; vertical-align: -0.125em; margin-left: 3px;"><path d="M6 9l6 6 6-6"></path></svg></a>
        <a class="chip" href="RepoMenu.dc.html" style="text-decoration: none;"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h10l3 3v13H6zM9 9h6M9 13h6"></path></svg>Repo<svg width="0.9em" height="0.9em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; vertical-align: -0.125em; margin-left: 3px;"><path d="M6 9l6 6 6-6"></path></svg></a>
        <span style="flex: 1;"></span>
        <a class="chip" href="ModelMenu.dc.html" style="text-decoration: none;">Sonnet 5.5 <span style="color: #9C9890;">High</span></a>
        <a class="chip" href="ModelMenu.dc.html" style="text-decoration: none;">Auto</a>
        <span title="12% of this month's limit used" style="width: 32px; height: 32px; display: grid; place-items: center;"><svg width="16" height="16" viewBox="0 0 20 20" role="img" aria-label="12 percent of this month's limit used"><circle cx="10" cy="10" r="7.5" fill="none" stroke="#3A3835" stroke-width="3"></circle><circle cx="10" cy="10" r="7.5" fill="none" stroke="#9C88FF" stroke-width="3" stroke-dasharray="5.6 47.1" transform="rotate(-90 10 10)"></circle></svg></span>
      </div>
    </div>
  </div>
