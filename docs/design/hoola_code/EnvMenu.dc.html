<html lang="en">
<head>

</head>

<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1C1B1A}
a{color:#B7A9FF}a:hover{color:#D3C9FF}
</style>
<style>body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-feature-settings:'kern','liga'}::placeholder{color:#8F8B84;opacity:1}textarea{resize:none}[role=menu],[role=listbox]{box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 16px 48px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.35)!important}[role=dialog]{box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 30px 80px rgba(0,0,0,.6)!important}form,section{box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 900px; background: #1C1B1A; color: #F3F1EC; font-family: 'Schibsted Grotesk', system-ui, sans-serif;">
<dc-import name="Sidebar" hint-size="260px,900px"></dc-import>
<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; position: relative;">
  <div style="height: 48px; display: flex; align-items: center; padding: 0 20px; font-size: 14px; color: #BBB8B0;">New session</div>
  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; opacity: .45;">
    <svg width="56" height="56" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#9C88FF"></circle><path d="M8 7v10M16 7v10M8 12h8" stroke="#14102B" stroke-width="2.4" stroke-linecap="round" fill="none"></path></svg>
    <p style="margin: 0; font-family: Literata, serif; font-size: 34px;">Ready when you are</p>
  </div>

  <div role="dialog" aria-label="Choose environment" style="position: absolute; left: 180px; bottom: 112px; width: 380px; background: #262523; border: 1px solid #3A3835; border-radius: 14px; box-shadow: 0 18px 50px rgba(0,0,0,.5); overflow: hidden;">
    <div style="padding: 10px; border-bottom: 1px solid #34322F;">
      <label for="envq" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Search environments</label>
      <input id="envq" placeholder="Search environments" style="width: 100%; box-sizing: border-box; height: 36px; padding: 0 10px; border: 0; border-radius: 8px; background: #1F1E1C; color: #F3F1EC; font: 14px 'Schibsted Grotesk', sans-serif; outline: none;">
    </div>
    <div style="display: flex; justify-content: space-between; padding: 12px 18px; font-size: 13px; color: #9C9890; border-bottom: 1px solid #34322F;"><span>Your PC</span><span>Needs Hoola Desktop</span></div>
    <div style="padding: 10px 18px 4px; font-size: 13px; color: #9C9890;">Cloud</div>
    <div style="display: flex; flex-direction: column; padding: 0 8px 6px;">
      <button style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 8px 10px; border: 0; border-radius: 8px; background: none; color: #F3F1EC; font: 15px 'Schibsted Grotesk', sans-serif; text-align: left; cursor: pointer;">Auto<span style="font-size: 13px; color: #9C9890;">Chooses based on repository</span></button>
      <div style="display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 8px; background: #2F2D2A;">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px; font-size: 15px;">Default<span style="font-size: 13px; color: #9C9890;">Limited network · package managers</span></span>
        <a href="EnvDialog.dc.html" aria-label="Edit Default" style="width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; color: #D9D6CE;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></a>
        <button aria-label="Make Default my favourite" style="width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: 8px; background: none; color: #D9D6CE;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg></button>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9C88FF" stroke-width="2" stroke-linecap="round" role="img" aria-label="Selected"><path d="M5 12l5 5 9-10"></path></svg>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 8px;">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px; font-size: 15px;">Node CI<span style="font-size: 13px; color: #9C9890;">Full network · setup script</span></span>
        <a href="EnvDialog.dc.html" aria-label="Edit Node CI" style="width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; color: #D9D6CE;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></a>
        <span style="width: 32px;"></span><span style="width: 18px;"></span>
      </div>
    </div>
    <a href="EnvDialog.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-top: 1px solid #34322F; color: #F3F1EC; text-decoration: none; font-size: 15px;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New environment</a>
  </div>

  <div style="padding: 0 24px 22px; display: flex; justify-content: center;">
    <div style="width: 100%; max-width: 820px; display: flex; flex-direction: column; gap: 6px;">
      <div style="display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 6px 12px; border: 1px solid #3A3835; border-radius: 16px; background: #262523; color: #9C9890; font-size: 15px;"><span style="font-size: 20px; width: 24px; text-align: center;">+</span><span style="flex: 1;">Describe a task or ask a question</span></div>
      <div style="display: flex; align-items: center; gap: 2px; font-size: 13px; color: #D9D6CE;">
        <span style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 8px; background: #2F2D2A; font-weight: 500;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .6-7.9A6 6 0 0 0 6.6 9 4.5 4.5 0 0 0 7 18z"></path></svg>Default<svg width="0.9em" height="0.9em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; vertical-align: -0.125em; margin-left: 3px;"><path d="M6 15l6-6 6 6"></path></svg></span>
        <span style="height: 32px; display: inline-flex; align-items: center; padding: 0 10px; font-weight: 500;">Repo<svg width="0.9em" height="0.9em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; vertical-align: -0.125em; margin-left: 3px;"><path d="M6 9l6 6 6-6"></path></svg></span>
        <span style="flex: 1;"></span>
        <span style="padding: 0 10px; font-weight: 500;">Sonnet 5.5 <span style="color: #9C9890;">High</span></span><span style="padding: 0 10px; font-weight: 500;">Auto</span>
      </div>
    </div>
  </div>
</main>
</div>
</x-dc>
