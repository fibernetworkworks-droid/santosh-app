<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hoola Code phone · Repositories</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{margin:0;background:#1C1B1A}</style>
<style>body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-feature-settings:'kern','liga'}::placeholder{color:#8F8B84;opacity:1}textarea{resize:none}[role=menu],[role=listbox]{box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 16px 48px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.35)!important}[role=dialog]{box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 30px 80px rgba(0,0,0,.6)!important}form,section{box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; display: flex; flex-direction: column; background: #121110; color: #F3F1EC; font-family: 'Schibsted Grotesk', system-ui, sans-serif;">
  <div role="dialog" aria-label="Repositories" style="position: absolute; left: 0; right: 0; bottom: 0; top: 70px; background: #232220; border-radius: 28px 28px 0 0; padding: 10px 8px 16px; display: flex; flex-direction: column;">
    <div style="width: 40px; height: 4px; border-radius: 4px; background: #4A4945; align-self: center; margin-bottom: 8px;"></div>
    <div style="display: flex; align-items: center; padding: 0 4px;">
      <a href="PhoneHome.dc.html" aria-label="Close" style="width: 48px; height: 48px; display: grid; place-items: center; color: #F3F1EC; font-size: 22px; text-decoration: none;"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; vertical-align: -0.125em;"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
      <div style="flex: 1; text-align: center; font-size: 20px; font-weight: 600;">Repositories</div>
      <a href="PhoneHome.dc.html" style="min-width: 48px; height: 48px; display: grid; place-items: center; color: #B7A9FF; text-decoration: none; font-size: 16px; font-weight: 600;">Done</a>
    </div>
    <div style="margin: 10px 8px 6px; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 14px; background: #1C1B1A; border: 1px solid #3A3835;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9C9890" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <label for="rs" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Search repositories</label>
      <input id="rs" placeholder="Search repositories" style="flex: 1; min-width: 0; border: 0; background: none; color: #F3F1EC; font: 16px 'Schibsted Grotesk', sans-serif; outline: none;">
    </div>
    <div style="padding: 8px 16px 4px; font-size: 13px; color: #9C9890;">Selected · 1</div>
    <div style="flex: 1; overflow: hidden; display: flex; flex-direction: column;">
      <sc-for list="{{ repos }}" as="r" hint-placeholder-count="7">
        <div style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 0 16px; border-bottom: 1px solid #2E2C29;">
          <span style="width: 36px; height: 36px; flex: none; border-radius: 10px; background: #2F2D2A; display: grid; place-items: center; font-weight: 600; color: #D9D6CE;">{{ r.initial }}</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 13px; color: #9C9890;">{{ r.owner }}</span><span style="font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ r.name }}</span></span>
          <span role="checkbox" aria-checked="{{ r.on }}" aria-label="{{ r.name }}" style="{{ r.box }}"><sc-if value="{{ r.on }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none;"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if></span>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px 12px 0;">
      <p style="margin: 0 4px; font-size: 13px; color: #9C9890; line-height: 1.45;">Pick more than one repo and Hoola works across all of them in one session. It can push only to its own hoola/… branches.</p>
      <a href="#" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border: 1px solid #3A3835; border-radius: 999px; background: #2A2826; color: #F3F1EC; text-decoration: none; font-size: 16px; font-weight: 600;"><svg width="1.05em" height="1.05em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none; vertical-align: -0.15em; margin-right: 0.35em;"><path d="M12 5v14M5 12h14"></path></svg>Connect more on GitHub</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const list = [
      ['fibernetworkworks-droid', 'santosh-app', true],
      ['fibernetworkworks-droid', 'hoola-builds', false],
      ['fibernetworkworks-droid', 'fnw-flow-maps', false],
      ['meghana', 'clinic-website', false],
      ['meghana', 'shop-backend', false],
      ['newtika', 'docs', false],
      ['newtika', 'brand-kit', false]
    ];
    const box = (on) => 'width: 26px; height: 26px; flex: none; border-radius: 8px; display: grid; place-items: center; font-size: 15px; font-weight: 700; ' + (on ? 'background: #9C88FF; color: #14102B;' : 'border: 2px solid #4A4945; box-sizing: border-box; color: transparent;');
    return { repos: list.map(([o, n, on]) => ({ owner: o, name: n, on, initial: n[0].toUpperCase(), box: box(on), tick: on ? '✓' : '' })) };
  }
}
</script>
</body>
</html>
