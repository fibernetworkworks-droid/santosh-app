<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hoola Code · Choose repository</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1C1B1A}
a{color:#B7A9FF}a:hover{color:#D3C9FF}
</style>
<style>body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-feature-settings:'kern','liga'}::placeholder{color:#8F8B84;opacity:1}textarea{resize:none}[role=menu],[role=listbox]{box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 16px 48px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.35)!important}[role=dialog]{box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 30px 80px rgba(0,0,0,.6)!important}form,section{box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 900px; background: #1C1B1A; color: #F3F1EC; font-family: 'Schibsted Grotesk', system-ui, sans-serif;">
<dc-import name="Sidebar" hint-size="260px,900px"></dc-import>
<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; position: relative;">
  <div style="height: 48px; display: flex; align-items: center; padding: 0 20px; font-size: 14px; color: #BBB8B0;">New session</div>
  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; opacity: .45;">
    <svg width="56" height="56" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#9C88FF"></circle><path d="M8 7v10M16 7v10M8 12h8" stroke="#14102B" stroke-width="2.4" stroke-linecap="round" fill="none"></path></svg>
    <p style="margin: 0; font-family: Literata, serif; font-size: 34px;">Ready when you are</p>
  </div>

  <div role="dialog" aria-label="Choose repository" style="position: absolute; left: 276px; bottom: 112px; width: 420px; background: #262523; border: 1px solid #3A3835; border-radius: 14px; box-shadow: 0 18px 50px rgba(0,0,0,.5); overflow: hidden;">
    <div style="padding: 10px; border-bottom: 1px solid #34322F;">
      <label for="rq" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Search repositories</label>
      <input id="rq" placeholder="Search repositories" style="width: 100%; box-sizing: border-box; height: 36px; padding: 0 10px; border: 0; border-radius: 8px; background: #1F1E1C; color: #F3F1EC; font: 14px 'Schibsted Grotesk', sans-serif; outline: none;">
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px; padding: 8px;">
      <sc-for list="{{ repos }}" as="r" hint-placeholder-count="4">
        <button style="{{ r.style }}">
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; text-align: left;"><span style="font-size: 13px; color: #9C9890;">{{ r.owner }}</span><span style="font-size: 15px; color: #F3F1EC;">{{ r.name }}</span></span>
          <span style="font-size: 12px; color: #9C9890;">{{ r.tag }}</span>
          <sc-if value="{{ r.on }}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9C88FF" stroke-width="2" stroke-linecap="round" role="img" aria-label="Selected"><path d="M5 12l5 5 9-10"></path></svg></sc-if>
        </button>
      </sc-for>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-top: 1px solid #34322F; font-size: 14px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#BBB8B0" stroke-width="1.8" aria-hidden="true"><circle cx="6" cy="6" r="2"></circle><circle cx="6" cy="18" r="2"></circle><circle cx="18" cy="8" r="2"></circle><path d="M6 8v8M18 10a6 6 0 0 1-6 6H8"></path></svg>
      <span style="color: #BBB8B0;">Start from</span>
      <button style="display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid #3A3835; border-radius: 8px; background: #1F1E1C; color: #F3F1EC; font: 13px 'JetBrains Mono', monospace;">main<svg width="0.9em" height="0.9em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; vertical-align: -0.125em; margin-left: 3px;"><path d="M6 9l6 6 6-6"></path></svg></button>
      <span style="flex: 1;"></span>
      <span style="font-size: 13px; color: #9C9890;">Works on hoola/… branch</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 12px; border-top: 1px solid #34322F;">
      <button style="display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border: 1px solid #3A3835; border-radius: 999px; background: none; color: #F3F1EC; font: 500 14px 'Schibsted Grotesk', sans-serif; white-space: nowrap;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true" style="flex: none;"><path d="M12 5v14M5 12h14"></path></svg>Add another repo</button>
      <span style="flex: 1;"></span>
      <a href="#" style="display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 999px; color: #D9D6CE; text-decoration: none; font-weight: 500; font-size: 14px;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true" style="flex: none;"><path d="M12 5v14M5 12h14"></path></svg>Connect more</a>
    </div>
  </div>

  <div style="padding: 0 24px 22px; display: flex; justify-content: center;">
    <div style="width: 100%; max-width: 820px; display: flex; flex-direction: column; gap: 6px;">
      <div style="display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 6px 12px; border: 1px solid #3A3835; border-radius: 16px; background: #262523; color: #9C9890; font-size: 15px;"><span style="font-size: 20px; width: 24px; text-align: center;">+</span><span style="flex: 1;">Describe a task or ask a question</span></div>
      <div style="display: flex; align-items: center; gap: 2px; font-size: 13px; color: #D9D6CE; font-weight: 500;">
        <span style="height: 32px; display: inline-flex; align-items: center; padding: 0 10px;"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; vertical-align: -0.125em; margin-right: 0.4em;"><path d="M7 18h10a4 4 0 0 0 .6-7.9A6 6 0 0 0 6.6 9 4.5 4.5 0 0 0 7 18z"></path></svg> Default<svg width="0.9em" height="0.9em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; vertical-align: -0.125em; margin-left: 3px;"><path d="M6 9l6 6 6-6"></path></svg></span>
        <span style="height: 32px; display: inline-flex; align-items: center; padding: 0 10px; border-radius: 8px; background: #2F2D2A;">shop-api<svg width="0.9em" height="0.9em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; vertical-align: -0.125em; margin-left: 3px;"><path d="M6 15l6-6 6 6"></path></svg></span>
        <span style="flex: 1;"></span>
        <span style="padding: 0 10px;">Sonnet 5.5 <span style="color: #9C9890;">High</span></span><span style="padding: 0 10px;">Auto</span>
      </div>
    </div>
  </div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const base = 'display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 0; border-radius: 10px; font-family: inherit; cursor: pointer; width: 100%;';
    const repos = [
      { owner: 'meghana', name: 'shop-api', tag: 'Private', on: true },
      { owner: 'meghana', name: 'shop-web', tag: 'Private', on: false },
      { owner: 'newtika', name: 'santosh-app', tag: 'Private', on: false },
      { owner: 'newtika', name: 'partner-portal', tag: 'Public', on: false }
    ];
    return { repos: repos.map((r) => ({ ...r, style: base + (r.on ? ' background: #2F2D2A;' : ' background: #201F1D;') })) };
  }
}
</script>
</body>
</html>
