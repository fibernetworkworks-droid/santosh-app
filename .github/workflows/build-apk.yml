name: Build Santosh APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # lets the main-branch build publish the APK as a GitHub release

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.5"
          cache: true
      - name: Generate the Android project
        run: flutter create --org com.newtika --project-name santosh --platforms android .
      - name: Apply Santosh Android settings
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tool/patch_android.py
      - run: flutter pub get
      - name: App icon
        run: dart run flutter_launcher_icons
      - name: Analyze (report only, shown as annotations)
        run: |
          dart analyze --format=machine lib > analyze.txt 2>/dev/null || true
          while IFS='|' read -r sev type code file line col len msg; do
            [ -n "$file" ] && echo "::warning file=${file#$PWD/},line=$line::$sev $code: $msg"
          done < analyze.txt
          true
      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee /tmp/b.log || {
            grep -iE "error|exception|because|incompatible|requires|not found|unresolved|failed|minSdk|compileSdk|namespace" /tmp/b.log | tail -50 | while IFS= read -r L; do echo "::error::$L"; done
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: santosh-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish release (main branch, signed builds only)
        if: github.ref == 'refs/heads/main' && env.SIGNED == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          gh release create "v$V-b${{ github.run_number }}" build/app/outputs/flutter-apk/app-release.apk \
            --title "Hoola v$V (build ${{ github.run_number }})" \
            --notes "Android app. On the phone open: https://github.com/${{ github.repository }}/releases/latest/download/app-release.apk" \
            --latest
