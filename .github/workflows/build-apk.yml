name: Build Santosh APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # lets the main-branch build publish the APK as a GitHub release

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.5"
          cache: true
      - name: Generate the Android project
        run: flutter create --org com.newtika --project-name santosh --platforms android .
      - name: Apply Santosh Android settings
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tool/patch_android.py
      - run: flutter pub get
      - name: App icon
        run: dart run flutter_launcher_icons
      - name: Analyze (report only, shown as annotations)
        run: |
          dart analyze --format=machine lib > analyze.txt 2>/dev/null || true
          while IFS='|' read -r sev type code file line col len msg; do
            [ -n "$file" ] && echo "::warning file=${file#$PWD/},line=$line::$sev $code: $msg"
          done < analyze.txt
          true
      - name: Gradle download that survives a GitHub outage
        # 8 Nov: every Gradle download (services.gradle.org redirects to github.com/gradle/gradle-distributions) answered 504.
        # If GitHub's copy answers, nothing changes. If not, the wrapper is pointed at a public mirror, and the wrapper
        # itself checks the file against the SHA-256 Gradle publishes on services.gradle.org - a wrong file never runs.
        run: |
          P=android/gradle/wrapper/gradle-wrapper.properties
          [ -f "$P" ] || exit 0
          V=$(grep distributionUrl "$P" | sed -E 's#.*gradle-([0-9.]+)-(all|bin)\.zip.*#\1#')
          echo "Gradle $V"
          ok=""
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 40 -r 0-1023 "https://services.gradle.org/distributions/gradle-${V}-bin.zip")
            [ "$code" = "200" ] || [ "$code" = "206" ] && { ok=1; break; }
            echo "Gradle download answered $code (try $i)"; sleep $((i*10))
          done
          if [ -z "$ok" ]; then
            SUM=$(curl -fsSL --max-time 30 "https://services.gradle.org/distributions/gradle-${V}-bin.zip.sha256")
            echo "$SUM" | grep -Eq '^[0-9a-f]{64}$' || { echo "::error::No official Gradle checksum - refusing a mirror"; exit 1; }
            sed -i -E "s#^distributionUrl=.*#distributionUrl=https\\\\://mirrors.cloud.tencent.com/gradle/gradle-${V}-bin.zip#" "$P"
            sed -i '/^distributionSha256Sum=/d' "$P"; echo "distributionSha256Sum=$SUM" >> "$P"
            echo "::warning::Gradle from the mirror, checked against Gradle's own SHA-256 $SUM"
          fi
          cat "$P"
      - name: Build APK
        run: |
          set -o pipefail
          # A download blip (504 / Gateway Time-out / could not GET) is retried up to 3 times; a real code error fails at once.
          ok=""
          for i in 1 2 3; do
            if flutter build apk --release --target-platform android-arm,android-arm64 2>&1 | tee /tmp/b.log; then ok=1; break; fi
            grep -qiE "504|Gateway Time-out|Could not GET|Could not download|downloading artifacts from the network|Connection reset|timed out" /tmp/b.log || break
            echo "::warning::Network trouble while building (try $i) - waiting and trying again"; sleep $((i*45))
          done
          [ -n "$ok" ] || {
            grep -iE "error|exception|because|incompatible|requires|not found|unresolved|failed|minSdk|compileSdk|namespace" /tmp/b.log | tail -50 | while IFS= read -r L; do echo "::error::$L"; done
            exit 1
          }
      - name: Check the APK opens (phones only, not truncated)
        run: |
          A=build/app/outputs/flutter-apk/app-release.apk
          unzip -tq "$A"
          unzip -l "$A" | grep -q 'lib/arm64-v8a/' || { echo "::error::no arm64 libs"; exit 1; }
          if unzip -l "$A" | grep -qE 'lib/x86'; then echo "::error::x86 libs still inside (APK too big)"; exit 1; fi
          echo "::notice::APK size $(du -m "$A" | cut -f1) MB, sha256 $(sha256sum "$A" | cut -c1-16)"
      - uses: actions/upload-artifact@v4
        with:
          name: santosh-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish release (main branch, signed builds only)
        if: github.ref == 'refs/heads/main' && env.SIGNED == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          gh release create "v$V-b${{ github.run_number }}" build/app/outputs/flutter-apk/app-release.apk \
            --title "Hoola v$V (build ${{ github.run_number }})" \
            --notes "Android app. On the phone open: https://github.com/${{ github.repository }}/releases/latest/download/app-release.apk" \
            --latest
