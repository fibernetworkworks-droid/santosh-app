name: Build Santosh APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate the Android project
        run: flutter create --org com.newtika --project-name santosh --platforms android .
      - name: Apply Santosh Android settings
        run: python3 tool/patch_android.py
      - run: flutter pub get
      - name: App icon
        run: dart run flutter_launcher_icons
      - name: Analyze (report only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: santosh-apk
          path: build/app/outputs/flutter-apk/app-release.apk
