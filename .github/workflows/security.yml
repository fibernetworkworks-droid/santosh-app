name: Security checks

# v0.49 leaked keys (gitleaks, MIT), risky Python (bandit, Apache-2.0) and known-vulnerable packages
# (osv-scanner, Apache-2.0). They report on every push; turn continue-on-error off once the first findings are fixed.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Leaked keys (gitleaks)
        continue-on-error: true
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --no-banner -v .
      - name: Risky Python (bandit)
        continue-on-error: true
        run: |
          pip install -q bandit==1.7.10
          bandit -q -r server/app -x server/app/static -ll -ii
      - name: Known-vulnerable packages (osv-scanner)
        continue-on-error: true
        run: |
          curl -fsSL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v1.9.2/osv-scanner_linux_amd64
          chmod +x osv-scanner
          ./osv-scanner -r --skip-git .
