name: App Sahayak iPhone build check

# v0.332 IPHONE (App Phase 6): generates the fixture app's iPhone project from the same spec the Android check uses,
# compiles it with the real Xcode (simulator debug + device release, unsigned), then opens EVERY screen in an iPhone
# simulator, photographs it and fails on a crash. Runs only when the iOS generator / kit changes (macOS minutes are dear).

on:
  push:
    paths:
      - "server/app/appmaker/ios/**"
      - ".github/workflows/ios-check.yml"
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - name: Xcode + XcodeGen
        run: |
          xcodebuild -version | tee xc.txt
          while IFS= read -r l; do echo "::notice::${l}"; done < xc.txt
          brew install xcodegen > /dev/null 2>&1 || brew upgrade xcodegen > /dev/null 2>&1 || true
          xcodegen --version
      - name: Generate the fixture iPhone project
        run: |
          python3 server/app/appmaker/ios/gen.py server/app/appmaker/android/fixture/spec.json "$RUNNER_TEMP/ios"
          cd "$RUNNER_TEMP/ios" && xcodegen generate --quiet && ls
      - name: Build (simulator debug + device release, unsigned)
        working-directory: ${{ runner.temp }}/ios
        run: |
          set -o pipefail
          P=$(ls -d *.xcodeproj | head -1)
          xcodebuild -project "$P" -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath dd CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: .*Sources/(Kit|App|Screens)|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
          xcodebuild -project "$P" -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath ddr CODE_SIGNING_ALLOWED=NO build 2>&1 | tee release.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" release.log
      - name: Swift errors as annotations
        if: failure()
        working-directory: ${{ runner.temp }}/ios
        run: |
          cat build.log release.log 2>/dev/null | grep -E "error:" | sort -u | head -60 | while IFS= read -r l; do echo "::error::${l}"; done
      - name: Every screen on an iPhone simulator (no crash + pictures)
        working-directory: ${{ runner.temp }}/ios
        run: |
          APP=$(find dd/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          bash hoola_qa/sim_check.sh "$APP" "$(cat hoola_qa/bundle.txt)" "$GITHUB_WORKSPACE/ios-shots" $(cat hoola_qa/screens.txt)
      - name: App Store screenshots are 1320x2868 (iPhone Pro Max simulator, v0.338)
        working-directory: ${{ runner.temp }}/ios
        run: |
          APP=$(find dd/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          SIM_KIND=max bash hoola_qa/sim_check.sh "$APP" "$(cat hoola_qa/bundle.txt)" "$GITHUB_WORKSPACE/store-shots" home cart orders
          python3 - "$GITHUB_WORKSPACE/store-shots/screens" <<'PY'
          import sys
          sys.path.insert(0, "hoola_qa")
          import asc
          from pathlib import Path
          shots = sorted(Path(sys.argv[1]).glob("*.png"))
          sizes = {p.name: asc.png_size(p.read_bytes()) for p in shots}
          print(sizes)
          bad = {k: v for k, v in sizes.items() if v not in asc.SIZES}
          if len(shots) < 4 or bad:
              print("::error::App Store screenshot sizes: " + str(bad or "missing"))
              sys.exit(1)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: A real Hoola server for the app's backend (e2e)
        working-directory: server
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/e2e.db
          WA_DRY_RUN: "true"
          SEMANTIC_OFF: "1"
          MEMORY_AUTO: "false"
          HOOLA_ENRICH: "false"
        run: |
          pip install -q -r requirements.txt || pip install -q fastapi "uvicorn[standard]" sqlalchemy pydantic-settings httpx anthropic \
            python-multipart cryptography pillow resvg-py
          python -m app.appmaker.android.ci_e2e prepare
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8077 > "$RUNNER_TEMP/uvicorn.log" 2>&1 &
          for i in $(seq 1 120); do curl -sf -o /dev/null http://127.0.0.1:8077/api/app-api/akf1c7a2e0000000000000001/schema && break; sleep 1; done
          curl -sf http://127.0.0.1:8077/api/app-api/akf1c7a2e0000000000000001/schema | head -c 200
      - name: The iPhone app against the real server (sign up, order, paid claim, crash report)
        run: bash server/app/appmaker/ios/ci_e2e.sh in.hoola.preview.fixture ios-shots
      - name: The order the iPhone app placed is on the server (priced by the server, sent once)
        if: always()
        working-directory: server
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/e2e.db
        run: |
          python -m app.appmaker.android.ci_e2e check
          tail -20 "$RUNNER_TEMP/uvicorn.log" || true
      - name: HOOLA QA report
        if: always()
        run: |
          [ -f ios-shots/report.json ] || { echo "::error::no simulator report"; exit 1; }
          python3 - <<'PY'
          import json, sys
          r = json.load(open("ios-shots/report.json"))
          print(json.dumps({k: r[k] for k in ("opened", "total", "crashed", "blank", "perf")}, indent=1))
          if not r["passed"] or r["total"] < 13:
              print("::error::simulator check failed: " + ", ".join(r["crashed"]))
              sys.exit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-check
          path: |
            ios-shots
            store-shots
            ${{ runner.temp }}/ios/build.log
            ${{ runner.temp }}/ios/release.log
          if-no-files-found: ignore
