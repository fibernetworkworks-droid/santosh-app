name: App Sahayak native build check

# v0.314: the smoke job also drives the app's own backend end to end (sign up, order through the offline outbox,
# server-priced, sent once) against a real Hoola server on the runner.
# v0.132: compiles the generated native Android project (the HoolaKit template + the fixture app) with the real toolchain
# (AGP 9.0.1, Gradle 9.1.0, Kotlin 2.2.10, Compose BOM 2026.09.00) whenever the template or the generator changes.

on:
  push:
    paths:
      - "server/app/appmaker/android/**"
      - ".github/workflows/appgen-check.yml"
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --list 2>/dev/null | grep -oE "platforms;android-3[6-9][^ ]*" | sort -u | tail -8 || true
          "$SDKM" --install "build-tools;36.0.0" > /dev/null
          "$SDKM" --install "platforms;android-37" > /dev/null 2>&1 || "$SDKM" --install "platforms;android-37.0" > /dev/null 2>&1 || echo "android-37 not in sdkmanager (AGP downloads it)"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: appgen-${{ hashFiles('server/app/appmaker/android/template/gradle/**', 'server/app/appmaker/android/template/**/*.kts') }}
      - name: Generate the fixture project
        run: python3 server/app/appmaker/android/gen.py server/app/appmaker/android/fixture/spec.json "$RUNNER_TEMP/proj"
      - name: Preview signing key
        run: |
          mkdir -p "$RUNNER_TEMP/proj/keys"
          keytool -genkeypair -keystore "$RUNNER_TEMP/proj/keys/preview.p12" -storetype PKCS12 -alias preview -keyalg RSA \
            -keysize 2048 -validity 3650 -dname "CN=Hoola Preview" -storepass hoolapreview -keypass hoolapreview
      - name: Build (release, R8)
        working-directory: ${{ runner.temp }}/proj
        env:
          HOOLA_PREVIEW_KEY_PASS: hoolapreview
        run: |
          set -o pipefail
          ./gradlew --no-daemon -q buildEnvironment 2>&1 | grep -iE "kotlin-gradle-plugin|com.android.tools.build:gradle" | head -8 | tee env.txt || true
          while IFS= read -r l; do echo "::notice::${l}"; done < env.txt
          ./gradlew --no-daemon --console=plain assembleRelease assembleDebug bundleRelease 2>&1 | tee build.log
      - name: Kotlin errors as annotations
        if: failure()
        run: |
          cd "$RUNNER_TEMP/proj" 2>/dev/null && [ -f build.log ] || exit 0
          grep -E '^e: ' build.log | head -60 | while IFS= read -r l; do echo "::error::${l}"; done
          grep -E 'What went wrong' -A 12 build.log | head -40 | while IFS= read -r l; do echo "::error::${l}"; done
          grep -iE 'kotlin-gradle-plugin|com.android.tools.build:gradle:' build.log | head -5 | while IFS= read -r l; do echo "::notice::${l}"; done
      - name: APK checks
        working-directory: ${{ runner.temp }}/proj
        run: |
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -1)      # v0.330 the Play Store bundle builds too
          ls -la "$AAB" && unzip -l "$AAB" | grep -q "base/manifest/AndroidManifest.xml"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          ls -la "$APK"
          unzip -t "$APK" > /dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | head -5
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | head -5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appgen-fixture
          path: |
            ${{ runner.temp }}/proj/build.log
            ${{ runner.temp }}/proj/app/build/outputs/apk/release/*.apk
            ${{ runner.temp }}/proj/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

  smoke:
    needs: compile
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # pictures of every screen go to the branch appgen-shots (easy to look at from anywhere)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: appgen-fixture
          path: out
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: A real Hoola server for the app's backend (v0.314 e2e)
        working-directory: server
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/e2e.db
          WA_DRY_RUN: "true"
          SEMANTIC_OFF: "1"
          MEMORY_AUTO: "false"
          HOOLA_ENRICH: "false"
        run: |
          pip install -q -r requirements.txt
          python -m app.appmaker.android.ci_e2e prepare
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8077 > "$RUNNER_TEMP/uvicorn.log" 2>&1 &
          for i in $(seq 1 90); do curl -sf -o /dev/null http://127.0.0.1:8077/api/app-api/akf1c7a2e0000000000000001/schema && break; sleep 1; done
          curl -sf http://127.0.0.1:8077/api/app-api/akf1c7a2e0000000000000001/schema | head -c 300
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Every screen on an emulator (no crash + pictures)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash server/app/appmaker/android/device_check.sh "$(find out -name '*debug*.apk' | head -1)" "$(find out -name '*release*.apk' | head -1)" shots in.hoola.preview.fixture home categories product cart orders profile dashboard support seller_info privacy delete_account hoola_login hoola_account hoola_inbox; bash server/app/appmaker/android/ci_e2e.sh shots "$(find out -name '*debug*.apk' | head -1)"
      - name: HOOLA QA report (every screen opened, budget, accessibility)
        if: always()
        run: |
          [ -f shots/report.json ] || { echo "::error::no device check report"; exit 1; }
          python3 - <<'PY'
          import json, sys
          r = json.load(open("shots/report.json"))
          print(json.dumps({k: r[k] for k in ("opened", "total", "crashed", "perf", "budget", "a11y_count")}, indent=1))
          for sid, x in r["screens"].items():
              for f in x["a11y"][:3]:
                  print(f"::notice::{sid}: {f['text']}")
          if not r["passed"] or r["total"] < 13:
              print("::error::device check failed: " + ", ".join(r["crashed"]) )
              sys.exit(1)
          fl = r.get("flows") or {}
          print("flows:", json.dumps(fl)[:1500])
          if not fl.get("tapped") or fl.get("crashed"):                 # v0.345 every button tapped, none crashed
              print("::error::flow walk: " + (json.dumps(fl.get("crashed")) if fl.get("crashed") else "no button was tapped"))
              sys.exit(1)
          if r["perf"]["cold_ms"] is None or r["perf"]["apk_mb"] is None:
              print("::error::device check did not measure cold start / APK size")
              sys.exit(1)
          PY
      - name: The order the app placed is on the server (priced by the server, sent once)
        if: always()
        working-directory: server
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/e2e.db
        run: |
          python -m app.appmaker.android.ci_e2e check
          tail -20 "$RUNNER_TEMP/uvicorn.log" || true
      - name: Pictures to the appgen-shots branch
        if: always()
        run: |
          [ -d shots ] || exit 0
          cd shots && git init -q && git checkout -q -b appgen-shots
          git -c user.name=hoola-ci -c user.email=ci@hoola.invalid add -A
          git -c user.name=hoola-ci -c user.email=ci@hoola.invalid commit -qm "screens ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" appgen-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appgen-screens
          path: shots
          if-no-files-found: ignore

  fixture2:
    # v0.351 PAKKA SABOOT: a second app made only by the generator - a field-service STAFF app in Hindi + English whose
    # lists carry every newer field kind (scan, photo, PDF, location, status) - compiled, every screen opened, every button
    # tapped on the emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "build-tools;36.0.0" > /dev/null
          "$SDKM" --install "platforms;android-37" > /dev/null 2>&1 || "$SDKM" --install "platforms;android-37.0" > /dev/null 2>&1 || true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: appgen-${{ hashFiles('server/app/appmaker/android/template/gradle/**', 'server/app/appmaker/android/template/**/*.kts') }}
      - name: Generate the field-service app
        run: python3 server/app/appmaker/android/gen.py server/app/appmaker/android/fixture2/spec.json "$RUNNER_TEMP/proj2"
      - name: Preview signing key
        run: |
          mkdir -p "$RUNNER_TEMP/proj2/keys"
          keytool -genkeypair -keystore "$RUNNER_TEMP/proj2/keys/preview.p12" -storetype PKCS12 -alias preview -keyalg RSA \
            -keysize 2048 -validity 3650 -dname "CN=Hoola Preview" -storepass hoolapreview -keypass hoolapreview
      - name: Build (debug + release, R8)
        working-directory: ${{ runner.temp }}/proj2
        env:
          HOOLA_PREVIEW_KEY_PASS: hoolapreview
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain assembleRelease assembleDebug 2>&1 | tee build.log
      - name: Kotlin errors as annotations
        if: failure()
        run: |
          grep -E '^e: ' "$RUNNER_TEMP/proj2/build.log" | head -60 | while IFS= read -r l; do echo "::error::${l}"; done
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Every screen and every button on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash "$RUNNER_TEMP/proj2/hoola_qa/device_check.sh" "$(ls $RUNNER_TEMP/proj2/app/build/outputs/apk/debug/*.apk | head -1)" "$(ls $RUNNER_TEMP/proj2/app/build/outputs/apk/release/*.apk | head -1)" shots2 in.hoola.preview.fixture2 $(cat $RUNNER_TEMP/proj2/hoola_qa/screens.txt); bash "$RUNNER_TEMP/proj2/hoola_qa/tablet_check.sh" "$(ls $RUNNER_TEMP/proj2/app/build/outputs/apk/debug/*.apk | head -1)" shots2 in.hoola.preview.fixture2 $(cat $RUNNER_TEMP/proj2/hoola_qa/screens.txt)
      - name: HOOLA QA report (field-service app)
        if: always()
        run: |
          [ -f shots2/report.json ] || { echo "::error::no device check report"; exit 1; }
          python3 - <<'PY'
          import json, sys
          r = json.load(open("shots2/report.json"))
          fl = r.get("flows") or {}
          print(json.dumps({k: r.get(k) for k in ("opened", "total", "crashed", "perf")}, indent=1), json.dumps(fl)[:1500])
          if not r["passed"] or r["total"] < 12 or not fl.get("tapped") or fl.get("crashed"):
              print("::error::field-service app check failed: " + json.dumps({"crashed": r.get("crashed"), "tap_crashed": fl.get("crashed")}))
              sys.exit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appgen-fixture2
          path: |
            shots2
            ${{ runner.temp }}/proj2/build.log
          if-no-files-found: ignore

  glogin:
    # v0.455 SURAKSHIT LOGIN: the shop app with Google sign-in switched on must compile and shrink (debug + release R8).
    # It pulls in androidx.credentials + googleid, so this job is the proof those libraries and SignInGoogle.kt build.
    # The client id here is a made-up test value - nothing signs in, only the build is checked.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "build-tools;36.0.0" > /dev/null
          "$SDKM" --install "platforms;android-37" > /dev/null 2>&1 || "$SDKM" --install "platforms;android-37.0" > /dev/null 2>&1 || true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: appgen-glogin-${{ hashFiles('server/app/appmaker/android/template/gradle/**', 'server/app/appmaker/android/template/**/*.kts') }}
      - name: Generate the shop app with Google sign-in on (test client id)
        run: |
          python3 - <<'PY'
          import json, os
          sp = json.load(open("server/app/appmaker/android/fixture/spec.json"))
          sp["seed"].setdefault("backend", {})["sign"] = {
              "ways": ["phone_otp", "google", "apple", "email_password"],
              "google_server_client_id": "123456789012-citest.apps.googleusercontent.com",
              "consent": True, "signup": True}
          json.dump(sp, open(os.environ["RUNNER_TEMP"] + "/spec-glogin.json", "w"))
          PY
          python3 server/app/appmaker/android/gen.py "$RUNNER_TEMP/spec-glogin.json" "$RUNNER_TEMP/projg"
          grep -q "libs.googleid" "$RUNNER_TEMP/projg/app/build.gradle.kts"
          grep -q "CredentialManager" "$RUNNER_TEMP/projg/app/src/main/java/hoola/kit/SignInGoogle.kt"
          grep -q 'SignInScreen()' "$RUNNER_TEMP/projg/app/src/main/java/hoola/app/AppScreens.kt"
      - name: Build with Google sign-in (debug + release, R8)
        working-directory: ${{ runner.temp }}/projg
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain assembleRelease assembleDebug 2>&1 | tee build.log
      - name: Kotlin errors as annotations
        if: failure()
        run: |
          grep -E '^e: |FAILURE|What went wrong' -A3 "$RUNNER_TEMP/projg/build.log" | head -60 | while IFS= read -r l; do echo "::error::${l}"; done

  fcm:
    # v0.367 TURANT: the shop app with instant notifications switched on (Firebase Cloud Messaging) must compile and shrink
    # (debug + release R8). The Firebase values here are a made-up test config - only the build is checked, no push is sent.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "build-tools;36.0.0" > /dev/null
          "$SDKM" --install "platforms;android-37" > /dev/null 2>&1 || "$SDKM" --install "platforms;android-37.0" > /dev/null 2>&1 || true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: appgen-fcm-${{ hashFiles('server/app/appmaker/android/template/gradle/**', 'server/app/appmaker/android/template/**/*.kts') }}
      - name: Generate the shop app with Firebase Messaging on (test config)
        run: |
          python3 - <<'PY'
          import json, os
          sp = json.load(open("server/app/appmaker/android/fixture/spec.json"))
          pkg = sp["app"]["app_id"]
          sp["fcm"] = json.dumps({"project_info": {"project_number": "123456789012", "project_id": "hoola-ci-test"},
                                  "client": [{"client_info": {"mobilesdk_app_id": "1:123456789012:android:abcdef0123456789",
                                                              "android_client_info": {"package_name": pkg}},
                                              "api_key": [{"current_key": "AIzaSyCiTestKeyNotReal000000000000000"}]}]})
          json.dump(sp, open(os.environ["RUNNER_TEMP"] + "/spec-fcm.json", "w"))
          PY
          python3 server/app/appmaker/android/gen.py "$RUNNER_TEMP/spec-fcm.json" "$RUNNER_TEMP/projf"
          grep -q "firebase.messaging" "$RUNNER_TEMP/projf/app/build.gradle.kts"
          grep -q "HoolaPush" "$RUNNER_TEMP/projf/app/src/main/AndroidManifest.xml"
      - name: Build with Firebase Messaging (debug + release, R8)
        working-directory: ${{ runner.temp }}/projf
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain assembleRelease assembleDebug 2>&1 | tee build.log
      - name: Kotlin errors as annotations
        if: failure()
        run: |
          grep -E '^e: |FAILURE|What went wrong' -A3 "$RUNNER_TEMP/projf/build.log" | head -60 | while IFS= read -r l; do echo "::error::${l}"; done
