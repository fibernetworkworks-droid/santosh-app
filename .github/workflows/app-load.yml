name: App backend on Postgres + load proof

# v0.390 PAKKI NEEV (App Sahayak Pillar B): every change to the app backend runs its suites on a REAL Postgres
# (the same code that runs on SQLite today), then the proof: 1,000 customers order a product with 300 in stock at the
# same moment, every 4th phone retrying, against 4 server worker processes on one database - exactly 300 orders, stock
# never below 0, one row per retried order, no server error. Also the SQLite -> Postgres move and cross-process locks.

on:
  push:
    paths:
      - "server/app/appmaker/**"
      - "server/app/site/webapp.py"
      - "server/app/db.py"
      - "server/app/dbmove.py"
      - "server/tests/test_v0390_pakki_neev.py"
      - "server/tests/test_v0396_apna_database.py"
      - "server/tests/test_v0404_apna_database_2.py"
      - "server/tests/test_v0407_live.py"
      - "server/tests/test_v0412_track.py"
      - "server/tests/test_v0418_paisa.py"
      - "server/app/paygate/**"
      - "server/app/pgdb/**"
      - ".github/workflows/app-load.yml"
  workflow_dispatch:

jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HOOLA_TEST_PG: postgresql+psycopg://postgres:hoola@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - name: Postgres 16 (enough lock slots for Hoola's many tables; a service container cannot take -c flags)
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD=hoola postgres:16 \
            -c max_locks_per_transaction=1024 -c max_connections=400 -c shared_buffers=256MB
          for i in $(seq 1 60); do docker exec pg pg_isready -U postgres && break; sleep 1; done
      - name: Her other databases - MariaDB (MySQL family) + MongoDB replica set (Atlas-like)
        run: |
          docker run -d --name my -p 3306:3306 -e MARIADB_ROOT_PASSWORD=hoola mariadb:11
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 60); do docker exec my mariadb -uroot -phoola -e 'select 1' >/dev/null 2>&1 && break; sleep 2; done
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]}).ok' && break; sleep 2; done
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Firebase - the official Firestore emulator
        run: |
          mkdir -p "$RUNNER_TEMP/fb" && cd "$RUNNER_TEMP/fb"
          echo '{"emulators":{"firestore":{"port":8080,"host":"127.0.0.1"}}}' > firebase.json
          nohup npx -y firebase-tools@15 emulators:start --only firestore --project demo-hoola > emu.log 2>&1 &
          for i in $(seq 1 90); do curl -s -o /dev/null http://127.0.0.1:8080 && break; sleep 2; done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install
        working-directory: server
        run: |
          pip install -q -r requirements.txt pytest pytest-xdist pytest-asyncio
          python -m playwright install --with-deps chromium     # app looks are rendered in a headless browser
      - name: App backend suites on Postgres
        working-directory: server
        run: |
          python -m pytest -q -p no:cacheprovider -n 4 tests/test_v0390_pakki_neev.py tests/test_v0382_dimaag.py \
            tests/test_v0357_stock.py tests/test_v0358_coupon.py tests/test_v0371_slot.py tests/test_v0359_khata.py \
            tests/test_v0355_gst_bill.py tests/test_v0352_kaam_baanto.py tests/test_v0314_app_backend.py \
            tests/test_v0407_live.py tests/test_v0412_track.py tests/test_v0418_paisa.py
      - name: Her move - a SQLite Hoola database copied into a fresh Postgres, every count equal
        working-directory: server
        env:
          HOOLA_TEST_PG: ""
          HOOLA_PG_ADMIN: postgresql+psycopg://postgres:hoola@127.0.0.1:5432/postgres
        run: python -m pytest -q -p no:cacheprovider tests/test_v0390_pakki_neev.py -k "dbmove or sqlite"
      - name: Her own database - an app's data running in "her Supabase" (link, write-through, her edits back, mirror)
        working-directory: server
        env:
          HOOLA_TEST_PG: ""
          HOOLA_PG_ADMIN: postgresql+psycopg://postgres:hoola@127.0.0.1:5432/postgres
        run: python -m pytest -q -p no:cacheprovider tests/test_v0396_apna_database.py
      - name: Her MySQL / MongoDB / Firebase - every kind against a real server
        working-directory: server
        env:
          HOOLA_TEST_PG: ""
          HOOLA_MYSQL_ADMIN: mysql://root:hoola@127.0.0.1:3306
          HOOLA_MONGO: mongodb://127.0.0.1:27017/?directConnection=true
          HOOLA_FIRESTORE_EMU: 127.0.0.1:8080
        run: python -m pytest -q -p no:cacheprovider tests/test_v0404_apna_database_2.py
      - name: The proof - 1,000 customers, 4 worker processes, one Postgres
        working-directory: server
        env:
          HOOLA_LOAD: "1"
        run: python -m pytest -q -s -p no:cacheprovider tests/test_v0390_pakki_neev.py -k thousand
