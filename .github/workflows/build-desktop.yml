name: Build Santosh Desktop

on:
  push:
    paths: ["desktop/**", ".github/workflows/build-desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Build PowerToys Run plugin payload (v1.8.0 W2b)
        shell: bash
        run: |
          # The 'hoola' plugin for PowerToys Run (desktop/ptrun_plugin). Built against the community
          # reference package (net9.0-windows), loads on PowerToys 0.87+ (.NET 9) and 0.102+ (.NET 10).
          # The three payload files ride INSIDE SantoshDesktop.exe (spec datas) so Hoola can install
          # the plugin itself to %LOCALAPPDATA%\Microsoft\PowerToys\PowerToys Run\Plugins\Hoola.
          dotnet publish desktop/ptrun_plugin/Community.PowerToys.Run.Plugin.Hoola \
            -c Release -p:Platform=x64 --nologo
          OUT=desktop/ptrun_plugin/Community.PowerToys.Run.Plugin.Hoola/bin/x64/Release/net9.0-windows10.0.26100.0/publish
          test -f "$OUT/Community.PowerToys.Run.Plugin.Hoola.dll" || { echo "plugin DLL missing"; exit 1; }
          test -f "$OUT/plugin.json" || { echo "plugin.json missing"; exit 1; }
          mkdir -p desktop/ptrun_payload/Images
          cp "$OUT/Community.PowerToys.Run.Plugin.Hoola.dll" desktop/ptrun_payload/
          cp "$OUT/plugin.json" desktop/ptrun_payload/
          cp "$OUT"/Images/*.png desktop/ptrun_payload/Images/
          ls -la desktop/ptrun_payload desktop/ptrun_payload/Images
      - name: Stage browser extension payload (v1.9.0 W3)
        shell: bash
        run: |
          # The MV3 'Hoola' extension (desktop/ext/hoola-extension) - the 'send page to Hoola'
          # door. No build needed (plain JS), staged whole so the spec rides it INSIDE
          # SantoshDesktop.exe (extracted to %TEMP%\_MEIxxxx\ext) and ext_install.py copies it
          # to %LOCALAPPDATA%\Hoola\chrome-extension for chrome://extensions 'Load unpacked'.
          rm -rf desktop/ext_payload
          cp -r desktop/ext/hoola-extension desktop/ext_payload
          test -f desktop/ext_payload/manifest.json || { echo "manifest missing"; exit 1; }
          test -f desktop/ext_payload/background.js || { echo "background.js missing"; exit 1; }
          test -d desktop/ext_payload/icons || { echo "icons missing"; exit 1; }
          ls -la desktop/ext_payload
      - name: Install
        working-directory: desktop
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.11.1
      - name: Smoke test
        working-directory: desktop
        run: |
          python -m santosh_desktop --version
          python -c "import santosh_desktop.app, santosh_desktop.tally, santosh_desktop.index, santosh_desktop.axtree"
      - name: Build SantoshDesktop.exe
        working-directory: desktop
        run: pyinstaller --noconfirm santosh_desktop.spec
      - name: Guard - AVIF codec must not be bundled
        working-directory: desktop
        run: |
          python -c "from PyInstaller.archive.readers import CArchiveReader; toc = CArchiveReader('dist/SantoshDesktop.exe').toc; names = list(toc) if hasattr(toc, 'keys') else [n for n, _ in toc]; bad = [n for n in names if 'avif' in n.lower()]; print('AVIF entries:', bad); assert not bad, 'AVIF module bundled - build must use santosh_desktop.spec excludes'"
      - name: Bundle agent-desktop helper (v1.6.0 semantic desktop mode)
        working-directory: desktop
        shell: bash
        run: |
          # vercel-labs/agent-desktop v1.1.0 (Apache-2.0): the accessibility-tree helper that powers ax_*.
          # Downloaded at BUILD time from the official release, checksum-verified, and shipped BESIDE
          # SantoshDesktop.exe (axtree.py looks for it there). Never bundled into the exe payload itself.
          AD=agent-desktop-v1.1.0-x86_64-pc-windows-msvc.tar.gz
          curl -sSL -o "$AD" "https://github.com/vercel-labs/agent-desktop/releases/download/v1.1.0/$AD"
          curl -sSL -o checksums.txt https://github.com/vercel-labs/agent-desktop/releases/download/v1.1.0/checksums.txt
          grep "$AD" checksums.txt | sha256sum -c -
          tar xzf "$AD" -C dist
          rm -rf "$AD" checksums.txt
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: SantoshDesktop
          path: desktop/dist/*
      - name: Publish (main branch)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          SIZE=$(stat -c%s desktop/dist/SantoshDesktop.exe)
          SHA=$(sha256sum desktop/dist/SantoshDesktop.exe | cut -d' ' -f1)
          ADSIZE=$(stat -c%s desktop/dist/agent-desktop.exe)
          # v1.8.0 W2b: the plugin payload also ships as a standalone zip (manual install = extract
          # into %LOCALAPPDATA%\Microsoft\PowerToys\PowerToys Run\Plugins, then restart PowerToys)
          (cd desktop/ptrun_payload && zip -r ../dist/Hoola-PowerToysRun-plugin.zip .)
          (cd desktop/ext_payload && zip -r ../dist/Hoola-Chrome-extension.zip .)
          gh release delete desktop-latest --yes --cleanup-tag || true
          gh release create desktop-latest desktop/dist/SantoshDesktop.exe desktop/dist/agent-desktop*.exe desktop/dist/Hoola-PowerToysRun-plugin.zip desktop/dist/Hoola-Chrome-extension.zip \
            --title "Santosh Desktop (Windows)" --latest=false \
            --notes "Connects your office PC to Santosh on your phone. Download: https://github.com/${{ github.repository }}/releases/download/desktop-latest/SantoshDesktop.exe
          ALSO download agent-desktop.exe (and any agent-desktop-windows-*.exe helper) into the SAME folder as SantoshDesktop.exe - it enables semantic desktop mode (v1.6.0: Hoola reads Excel / Word / Tally by real UI elements, not pixel guesses).
          Have PowerToys? The SantoshDesktop.exe now carries the 'hoola' PowerToys Run plugin (v1.8.0) - just ask Hoola ('Hoola ko PowerToys Run se khulwao') or extract Hoola-PowerToysRun-plugin.zip into %LOCALAPPDATA%\\Microsoft\\PowerToys\\PowerToys Run\\Plugins and restart PowerToys. No PowerToys? Ctrl+Alt+H brings the Hoola Desktop window up. The 'send page to Hoola' browser extension (v1.9.0 W3) rides inside the exe (Hoola Desktop > 'Browser extension' card) or extract Hoola-Chrome-extension.zip, then chrome://extensions > Developer mode > Load unpacked.
          Verify your download: size ${SIZE} bytes, sha256 ${SHA} (SantoshDesktop.exe), ${ADSIZE} bytes (agent-desktop.exe). If the exe shows \"Failed to extract ...\", the download was cut short or antivirus interfered - re-download and compare the size (see desktop/README.md)."
