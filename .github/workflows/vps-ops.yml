                echo 'cd $CORE && timeout 2400 .venv/bin/python -m app.devlab check 2>&1 | tail -40' ;;
              lab_try)
                # RUN lab_check (or lab_setup) FIRST after a deploy that bumps box.BASE_REV - the fixes live IN the
