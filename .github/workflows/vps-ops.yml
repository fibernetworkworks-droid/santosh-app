                echo 'cd $CORE && timeout 2400 .venv/bin/python -m app.devlab run --repo fibernetworkworks-droid/santosh-app --ref main --cmd "cd server && python3 -m pytest -q -p no:randomly tests/test_v0456_devlab.py tests/test_v0531_lab_loop.py" --timeout 900 2>&1 | tail -30' ;;
