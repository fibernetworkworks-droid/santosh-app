                echo 'cd $CORE && .venv/bin/pip install -q --upgrade "cadquery>=2.4,<3" "scikit-fem>=10,<13" "pyamg>=5,<6" "mujoco>=3,<4" "matplotlib>=3.9" "reportlab>=4.0" 2>&1 | tail -12'
