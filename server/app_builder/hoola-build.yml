# v0.132 Hoola App Builder on GitHub Actions (APP_BUILD_MODE=github). Put this file in a PRIVATE repo as
# .github/workflows/hoola-build.yml (main branch). Hoola pushes each app's project to the branch build/<app> under app/ and
# starts this workflow; the APK + build.log come back as the artifact hoola-<job>.
# Token for APP_BUILD_GH_TOKEN: fine-grained, only this repo: Contents read/write, Actions read/write.
name: hoola-build
on:
  workflow_dispatch:
    inputs:
      job:
        description: build id
        required: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "build-tools;36.0.0" "platforms;android-37" > /dev/null || true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: hoola-${{ hashFiles('app/gradle/**', 'app/**/*.kts') }}
      - name: Build
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain assembleRelease > build.log 2>&1 || (tail -200 build.log; exit 1)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hoola-${{ inputs.job }}
          path: |
            app/build.log
            app/app/build/outputs/apk/release/*.apk
          retention-days: 2
          if-no-files-found: ignore
