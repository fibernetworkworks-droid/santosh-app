# v0.132 Hoola App Builder on GitHub Actions (APP_BUILD_MODE=github). Put this file in a PRIVATE repo as
# .github/workflows/hoola-build.yml (main branch). Hoola pushes each app's project to the branch build/<app> under app/ and
# starts this workflow; the APK + build.log come back as the artifact hoola-<job>.
# Token for APP_BUILD_GH_TOKEN: fine-grained, only this repo: Contents read/write, Actions read/write.
# v0.325 HOOLA QA: after compiling, every screen is opened on an Android emulator (crash check, screenshots, accessibility),
# cold start / scrolling / APK size measured; the report + pictures come back in the same artifact (folder qa/).
# Replace your copy of this file with this version to get the device check (older copies still build).
name: hoola-build
on:
  workflow_dispatch:
    inputs:
      job:
        description: build id
        required: true
      kind:
        description: apk (preview + device check) or aab (Play Store bundle, v0.330)
        required: false
        default: apk
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "build-tools;36.0.0" "platforms;android-37" > /dev/null || true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: hoola-${{ hashFiles('app/gradle/**', 'app/**/*.kts') }}
      - name: Build
        working-directory: app
        run: |
          chmod +x gradlew
          if [ "${{ inputs.kind }}" = "aab" ]; then
            ./gradlew --no-daemon --console=plain bundleRelease > build.log 2>&1 || (tail -200 build.log; exit 1)
          else
            ./gradlew --no-daemon --console=plain assembleRelease assembleDebug > build.log 2>&1 || (tail -200 build.log; exit 1)
          fi
      - name: Enable KVM
        if: success() && inputs.kind != 'aab' && hashFiles('app/hoola_qa/device_check.sh') != ''
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Device check (HOOLA QA)
        if: success() && inputs.kind != 'aab' && hashFiles('app/hoola_qa/device_check.sh') != ''
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash app/hoola_qa/device_check.sh "$(ls app/app/build/outputs/apk/debug/*.apk | head -1)" "$(ls app/app/build/outputs/apk/release/*.apk | head -1)" qa "$(cat app/hoola_qa/package.txt)" $(cat app/hoola_qa/screens.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hoola-${{ inputs.job }}
          path: |
            app/build.log
            app/app/build/outputs/apk/release/*.apk
            app/app/build/outputs/bundle/release/*.aab
            qa/report.json
            qa/screens/*.png
          retention-days: 2
          if-no-files-found: ignore
