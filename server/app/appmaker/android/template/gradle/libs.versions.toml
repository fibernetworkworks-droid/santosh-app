# Made by Hoola App Sahayak. Pinned set, the only libraries a generated app may use.
# AGP 9.4.0 (Sep 2026) = built-in Kotlin (KGP 2.2.10 on the classpath, checked in CI), Gradle 9.6.0, JDK 17, build-tools 36,
# compileSdk 37 (Compose BOM 2026.09.00 needs it). Changing any version: CI appgen-check must stay green.
[versions]
agp = "9.4.0"
kotlin = "2.2.10"
composeBom = "2026.09.00"
coreKtx = "1.16.0"
activityCompose = "1.10.1"
lifecycle = "2.9.1"
coroutines = "1.10.2"
codeScanner = "16.1.0"
firebaseMessaging = "24.1.0"
credentials = "1.5.0"
googleid = "1.1.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
# v0.340 Google's code scanner (Play services shows its own camera screen; the app needs no camera permission)
gms-code-scanner = { group = "com.google.android.gms", name = "play-services-code-scanner", version.ref = "codeScanner" }
# v0.367 TURANT: Firebase Cloud Messaging - added to an app's build ONLY when she switches instant notifications on
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging", version.ref = "firebaseMessaging" }
# v0.442 SURAKSHIT LOGIN: "Continue with Google" through Credential Manager - added ONLY when she turns Google login on
credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
credentials-play-services = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
