<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Santosh</title>
<link rel="icon" href="/static/santosh-head.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root {
  --ink: #1E1537; --muted: #5E5780; --accent: #6D3FE0; --accent2: #A21CAF;
  --glass: rgba(255,255,255,.58); --line: rgba(255,255,255,.85);
  --ok: #15803D; --warn: #B45309; --bad: #B91C1C;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: 'Manrope', system-ui, sans-serif; color: var(--ink);
  background: linear-gradient(180deg, #F7F3FF, #EFE8FF 60%, #E9E1FB); overflow: hidden;
}
.blob { position: fixed; border-radius: 50%; filter: blur(70px); pointer-events: none; z-index: 0; }
.glass { background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(22px) saturate(160%);
  -webkit-backdrop-filter: blur(22px) saturate(160%); box-shadow: 0 12px 32px rgba(76,29,149,.12), inset 0 1px 0 rgba(255,255,255,.95); }
.app { position: relative; z-index: 1; height: 100%; max-width: 720px; margin: 0 auto; display: flex; flex-direction: column;
  padding: max(12px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); gap: 12px; }
header { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 24px; }
.avatar { width: 48px; height: 48px; border-radius: 24px; border: 2px solid #fff; background: linear-gradient(135deg,#EDE9FE,#FCE7F3); overflow: hidden; flex-shrink: 0; box-shadow: 0 4px 12px rgba(109,63,224,.2); }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.who { flex: 1; min-width: 0; }
.who b { font-family: 'Baloo 2', sans-serif; font-size: 20px; line-height: 1; display: block; }
.who span { font-size: 12px; font-weight: 600; color: var(--ok); display: inline-flex; align-items: center; gap: 6px; }
.who span::before { content: ""; width: 7px; height: 7px; border-radius: 4px; background: #16A34A; box-shadow: 0 0 0 3px rgba(22,163,74,.18); }
.pill { font-size: 11px; font-weight: 700; letter-spacing: .06em; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
.pill.test { color: var(--warn); background: rgba(254,243,199,.9); }
.pill.live { color: var(--ok); background: rgba(220,252,231,.9); }
.iconbtn { width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: rgba(255,255,255,.7); display: grid; place-items: center; cursor: pointer; flex-shrink: 0; }
.iconbtn:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#banner { display: none; padding: 12px 14px; border-radius: 18px; font-size: 13px; line-height: 1.5; color: #7C2D12; background: rgba(255,237,213,.9); border: 1px solid rgba(234,88,12,.25); }
#feed { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 4px 2px 8px; scroll-behavior: smooth; }
.hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 18px 0 4px; }
.hero img { height: 180px; filter: drop-shadow(0 18px 22px rgba(76,29,149,.22)); }
.hero p { margin: 0; color: var(--muted); font-size: 14px; max-width: 34ch; }
.msg { max-width: min(85%, 520px); padding: 13px 16px; border-radius: 22px; font-size: 15px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.bot { align-self: flex-start; border-bottom-left-radius: 8px; }
.msg.me { align-self: flex-end; color: #fff; border-bottom-right-radius: 8px; background: linear-gradient(135deg, #7C3AED, var(--accent2)); box-shadow: 0 12px 26px rgba(124,58,237,.3); }
.msg.note { border-left: 0; }
.steps { align-self: flex-start; display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 18px; min-width: 240px; max-width: 85%; }
.step { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #3B3360; }
.dot { width: 20px; height: 20px; border-radius: 10px; flex-shrink: 0; display: grid; place-items: center; }
.dot.run { border: 2.5px solid rgba(109,63,224,.2); border-top-color: var(--accent); animation: spin .8s linear infinite; }
.dot.done { background: #16A34A; }
.dot.err { background: #F59E0B; }
@keyframes spin { to { transform: rotate(360deg); } }
.card { align-self: stretch; padding: 16px; border-radius: 24px; display: flex; flex-direction: column; gap: 12px; }
.card .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.card h3 { margin: 0; font-size: 15.5px; }
.status { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
.s-awaiting_approval { color: var(--warn); background: #FEF3C7; } .s-ready { color: #1D4ED8; background: #DBEAFE; }
.s-sending { color: var(--accent); background: #EDE9FE; } .s-completed { color: var(--ok); background: #DCFCE7; }
.s-failed, .s-cancelled { color: var(--bad); background: #FEE2E2; } .s-paused, .s-waiting_limit { color: var(--muted); background: #F1F0F7; }
.bar { height: 7px; border-radius: 4px; background: rgba(109,63,224,.12); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #7C3AED, #C026D3); transition: width .6s; }
.nums { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; }
.nums div { background: rgba(255,255,255,.7); border-radius: 14px; padding: 10px 8px; text-align: center; }
.nums b { display: block; font-family: 'Baloo 2', sans-serif; font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; }
.nums span { font-size: 11px; color: var(--muted); }
.preview { font-size: 13px; color: #3B3360; background: rgba(255,255,255,.7); border-radius: 14px; padding: 10px 12px; white-space: pre-wrap; }
.reason { font-size: 12.5px; color: var(--muted); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { height: 44px; padding: 0 18px; border-radius: 14px; border: none; cursor: pointer; font: 700 14px 'Manrope', sans-serif; }
.btn.primary { color: #fff; background: linear-gradient(135deg, #7C3AED, var(--accent2)); box-shadow: 0 8px 18px rgba(124,58,237,.3); }
.btn.ghost { color: #4A3596; background: rgba(255,255,255,.8); border: 1px solid rgba(109,63,224,.2); }
.chip { align-self: flex-end; font-size: 12.5px; font-weight: 600; color: #4A3596; padding: 8px 12px; border-radius: 14px; }
.typing { align-self: flex-start; display: none; gap: 5px; padding: 14px 16px; border-radius: 18px; }
.typing i { width: 7px; height: 7px; border-radius: 4px; background: var(--accent); opacity: .4; animation: bob 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes bob { 50% { opacity: 1; transform: translateY(-3px); } }
.quick { display: flex; gap: 8px; flex-wrap: wrap; }
.quick button { height: 38px; padding: 0 14px; border-radius: 999px; font: 600 13px 'Manrope', sans-serif; color: #4A3596; cursor: pointer; }
form { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 24px; }
form input[type=text] { flex: 1; min-width: 0; height: 46px; border: none; outline: none; background: transparent; font: 500 15px 'Manrope', sans-serif; color: var(--ink); padding: 0 6px; }
.send { width: 48px; height: 48px; border-radius: 17px; border: none; cursor: pointer; display: grid; place-items: center; background: linear-gradient(135deg, #7C3AED, var(--accent2)); box-shadow: 0 8px 18px rgba(124,58,237,.35); flex-shrink: 0; }
.send:disabled { opacity: .5; cursor: default; }
.attach { width: 46px; height: 46px; border-radius: 16px; border: none; background: rgba(109,63,224,.08); display: grid; place-items: center; cursor: pointer; flex-shrink: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (prefers-reduced-motion: reduce) { .dot.run, .typing i { animation: none; } #feed { scroll-behavior: auto; } }
</style>
</head>
<body>
<div class="blob" style="width:320px;height:320px;left:-120px;top:80px;background:#A78BFA;opacity:.5"></div>
<div class="blob" style="width:280px;height:280px;right:-100px;top:340px;background:#F9A8D4;opacity:.55"></div>
<div class="blob" style="width:260px;height:260px;left:30%;bottom:-60px;background:#FCD34D;opacity:.35"></div>

<div class="app">
  <header class="glass">
    <div class="avatar"><img src="/static/santosh-head.png" alt="Santosh"></div>
    <div class="who"><b>Santosh</b><span>Online</span></div>
    <span id="mode" class="pill test">TEST MODE</span>
    <button class="iconbtn" id="newchat" aria-label="Start a new chat" title="Naya chat">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A3596" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </header>
  <div id="banner" role="status"></div>

  <main id="feed" aria-live="polite">
    <div class="hero">
      <img src="/static/santosh-happy.png" alt="">
      <p>Apni leads ki file (CSV ya Excel) attach kijiye aur boliye kya bhejna hai. Baaki kaam Santosh karega.</p>
    </div>
    <div class="typing glass" id="typing" aria-label="Santosh is typing"><i></i><i></i><i></i></div>
  </main>

  <div class="quick" id="quick">
    <button class="glass" type="button" data-q="Diwali offer ka WhatsApp campaign chalana hai">WhatsApp campaign</button>
    <button class="glass" type="button" data-q="Mere pichhle campaign ki report do">Campaign report</button>
  </div>

  <form class="glass" id="composer">
    <input type="file" id="file" class="sr" accept=".csv,.xlsx,.xlsm">
    <button class="attach" type="button" id="attach" aria-label="Attach a CSV or Excel file of leads">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A3596" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.4 11-9.2 9.2a6 6 0 0 1-8.5-8.5l8.6-8.6a4 4 0 0 1 5.7 5.7L9.4 17.4a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>
    </button>
    <label for="text" class="sr">Message Santosh</label>
    <input type="text" id="text" placeholder="Santosh se boliye…" autocomplete="off">
    <button class="send" type="submit" id="sendbtn" aria-label="Send">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg>
    </button>
  </form>
</div>

<script>
(() => {
  const qs = new URLSearchParams(location.search);
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
                  del(k) { try { localStorage.removeItem(k); } catch {} } };
  if (qs.get('key')) store.set('santosh_key', qs.get('key'));
  const KEY = store.get('santosh_key') || '';
  const H = KEY ? { Authorization: 'Bearer ' + KEY } : {};
  const feed = document.getElementById('feed'), typing = document.getElementById('typing');
  const banner = document.getElementById('banner');
  let conv = store.get('santosh_conv'), es = null, stepsBox = null;
  const cards = {};

  const api = async (path, opts = {}) => {
    const r = await fetch(path, { ...opts, headers: { ...H, ...(opts.headers || {}) } });
    if (!r.ok) { let m = r.statusText; try { m = (await r.json()).detail || m; } catch {} throw new Error(m); }
    return r.json();
  };
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const add = (node) => { feed.insertBefore(node, typing); feed.scrollTop = feed.scrollHeight; return node; };
  const showBanner = (t) => { banner.textContent = t; banner.style.display = t ? 'block' : 'none'; };

  const LABEL = { awaiting_approval: 'Meta review', ready: 'Taiyaar', sending: 'Bhej raha hoon', completed: 'Poora',
                  failed: 'Ruk gaya', cancelled: 'Cancel', paused: 'Ruka hua', waiting_limit: 'Kal tak' };

  function renderCampaign(v) {
    let c = cards[v.id];
    if (!c) {
      c = cards[v.id] = add(el('section', 'card glass'));
      c.setAttribute('aria-label', 'Campaign ' + v.title);
    }
    c.replaceChildren();
    const top = el('div', 'top'); top.append(el('h3', null, v.title));
    top.append(el('span', 'status s-' + v.status, LABEL[v.status] || v.status)); c.append(top);
    const bar = el('div', 'bar'); const fill = el('i'); fill.style.width = (v.progress || 0) + '%'; bar.append(fill); c.append(bar);
    const n = v.counts || {}; const nums = el('div', 'nums');
    [['Bheje', n.sent], ['Pahunche', n.delivered], ['Padhe', n.read], ['Jawab', n.replied]].forEach(([l, x]) => {
      const d = el('div'); d.append(el('b', null, String(x ?? 0)), el('span', null, l)); nums.append(d); });
    c.append(nums);
    if (v.template && (v.template.preview || v.template.body)) c.append(el('div', 'preview', v.template.preview || v.template.body));
    if (v.status_reason) c.append(el('div', 'reason', v.status_reason));
    const acts = el('div', 'actions');
    const act = (label, cls, action) => { const b = el('button', 'btn ' + cls, label); b.type = 'button';
      b.onclick = async () => { b.disabled = true; try { renderCampaign(await api(`/api/campaigns/${v.id}/action`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action }) })); } catch (e) { showBanner(e.message); } b.disabled = false; };
      acts.append(b); };
    if (v.status === 'ready') act('Haan, bhej do', 'primary', 'send');
    if (v.status === 'awaiting_approval' && !v.auto_send) act('Approve hote hi bhej dena', 'ghost', 'send');
    if (['sending', 'awaiting_approval', 'ready', 'waiting_limit'].includes(v.status)) act('Rokiye', 'ghost', 'pause');
    if (v.status === 'paused') act('Phir se chalao', 'primary', 'resume');
    if (acts.childElementCount) c.append(acts);
  }

  function onEvent(ev) {
    const p = ev.payload || {};
    if (ev.kind === 'message') {
      if (p.role === 'user') { stepsBox = null; add(el('div', 'msg me', p.text)); }
      else add(el('div', 'msg bot glass' + (p.source === 'worker' ? ' note' : ''), p.text));
    } else if (ev.kind === 'typing') {
      typing.style.display = p.on ? 'flex' : 'none';
      if (p.on) stepsBox = null;
      feed.scrollTop = feed.scrollHeight;
    } else if (ev.kind === 'step') {
      if (!stepsBox) stepsBox = add(el('div', 'steps glass'));
      let row = stepsBox.querySelector(`[data-id="${CSS.escape(p.id)}"]`);
      if (!row) { row = el('div', 'step'); row.dataset.id = p.id; row.append(el('span', 'dot'), el('span', null, p.label)); stepsBox.append(row); }
      const dot = row.firstChild; dot.className = 'dot ' + (p.state === 'running' ? 'run' : p.state === 'done' ? 'done' : 'err');
      dot.innerHTML = p.state === 'done' ? '<svg width="11" height="11" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2 6.2l2.6 2.6L10 3.4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' : '';
      feed.scrollTop = feed.scrollHeight;
    } else if (ev.kind === 'campaign') {
      renderCampaign(p);
    } else if (ev.kind === 'upload') {
      add(el('div', 'chip glass', `${p.filename} · ${p.valid} sahi number${p.invalid ? ` · ${p.invalid} galat` : ''}`));
    }
  }

  function connect() {
    if (es) es.close();
    const url = `/api/conversations/${conv}/events` + (KEY ? `?key=${encodeURIComponent(KEY)}` : '');
    es = new EventSource(url);
    es.onmessage = (m) => { try { onEvent(JSON.parse(m.data)); } catch (e) { console.error(e); } };
    es.onerror = () => {};   // EventSource reconnects by itself and resumes from the last id
  }

  async function start(fresh) {
    if (!fresh && conv) {
      try { await api(`/api/conversations/${conv}/messages`); }
      catch (e) { if (String(e.message).includes('API key')) throw e; conv = null; }
    }
    if (fresh || !conv) { conv = (await api('/api/conversations', { method: 'POST' })).id; store.set('santosh_conv', conv); }
    connect();
  }

  async function send(text) {
    text = text.trim(); if (!text) return;
    document.getElementById('text').value = '';
    try { await api(`/api/conversations/${conv}/messages`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) }); }
    catch (e) { showBanner('Message nahi gaya: ' + e.message); }
  }

  document.getElementById('composer').addEventListener('submit', (e) => { e.preventDefault(); send(document.getElementById('text').value); });
  document.getElementById('quick').addEventListener('click', (e) => { const q = e.target.closest('button')?.dataset.q; if (q) send(q); });
  document.getElementById('attach').onclick = () => document.getElementById('file').click();
  document.getElementById('file').onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    const fd = new FormData(); fd.append('file', f); fd.append('conversation_id', conv);
    try {
      const r = await api('/api/leads/upload', { method: 'POST', body: fd });
      await send(`Maine file upload ki hai: ${f.name} (list id: ${r.list_id}, ${r.valid} sahi number).`);
    } catch (err) { showBanner('File upload nahi hui: ' + err.message); }
    e.target.value = '';
  };
  document.getElementById('newchat').onclick = () => {
    store.del('santosh_conv'); feed.querySelectorAll('.msg,.steps,.card,.chip').forEach(n => n.remove());
    Object.keys(cards).forEach(k => delete cards[k]); start(true);
  };

  fetch('/healthz').then(r => r.json()).then(h => {
    const m = document.getElementById('mode');
    m.textContent = h.dry_run ? 'TEST MODE' : 'LIVE'; m.className = 'pill ' + (h.dry_run ? 'test' : 'live');
    if (!h.brain_configured) showBanner('Santosh ka dimaag abhi connect nahi hai: server par ANTHROPIC_API_KEY set kijiye.');
  }).catch(() => {});

  start(false).catch(async (e) => {
    if (String(e.message).includes('not found')) { store.del('santosh_conv'); conv = null; return start(true); }
    showBanner(e.message.includes('API key') ? 'API key chahiye: page ko ?key=AAPKI_KEY ke saath kholiye.' : 'Server se connect nahi ho paya: ' + e.message);
  });
})();
</script>
</body>
</html>
