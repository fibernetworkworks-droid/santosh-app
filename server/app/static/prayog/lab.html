<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hoola Prayogshala</title>
<link rel="stylesheet" href="lab.css?v=0.415.0">
</head>
<body>
<div id="app"><p class="mut" style="padding:16px">Lab khul raha hai…</p></div>
<script src="/api/prayog/three.js"></script>
<script src="kernels.js?v=0.415.0"></script>
<script src="lab3d.js?v=0.415.0"></script>
<script>
(function () {
  var id = (new URLSearchParams(location.search).get('id') || '').replace(/[^a-z0-9-]/g, '');
  var app = document.getElementById('app');
  function fail(t) { app.innerHTML = ''; var p = document.createElement('p'); p.className = 'err'; p.textContent = t; app.appendChild(p); }
  if (!window.THREE || !window.HoolaLab) { fail('3D engine load nahi hua. Internet check karke dobara kholiye.'); return; }
  fetch('/api/prayog/labs/' + id).then(function (r) { if (!r.ok) throw new Error(r.status === 404 ? 'Yeh lab nahi mila.' : 'Lab load nahi hua (' + r.status + ').'); return r.json(); })
    .then(function (d) { document.title = d.lab.title + ' · Prayogshala'; window.HoolaLab.open(app, d.lab); })
    .catch(function (e) { fail(e.message); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
