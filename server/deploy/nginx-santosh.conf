# /etc/nginx/sites-available/santosh  (then: ln -s to sites-enabled, certbot --nginx -d santosh.example.com)
server {
    listen 80;
    server_name santosh.example.com;
    client_max_body_size 30m;   # chat / call / Hoola files go up to 25 MB

    location /api/conversations/ {
        proxy_pass http://127.0.0.1:8077;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        # live updates (server-sent events) must not be buffered
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Santosh Commerce MCP server (/mcp/commerce): streamable HTTP answers as server-sent events
    location /mcp/ {
        proxy_pass http://127.0.0.1:8077;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # App Jaanch: APK / EXE files can be big, and the check takes up to a few minutes
    location /api/appcheck/upload {
        client_max_body_size 400m;
        proxy_pass http://127.0.0.1:8077;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 10m;
    }

    # v0.338 website Edit mode: her videos / audio / files (videos up to 60 MB)
    location ~ ^/api/sites/[^/]+/media$ {
        client_max_body_size 64m;
        proxy_pass http://127.0.0.1:8077;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 10m;
    }

    # v0.156 Podcast Sahayak: full-length episode audio / video uploads (up to 400 MB in code)
    location /api/podcast/episodes/ {
        client_max_body_size 400m;
        proxy_pass http://127.0.0.1:8077;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 10m;
    }

    # live voice calls (phone app and the Hoola Console in a browser) are WebSockets
    location /api/voice/ws {
        proxy_pass http://127.0.0.1:8077;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8077;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;   # v0.142 Hoola Console login limits use the real address
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
