# /etc/nginx/sites-available/santosh  (then: ln -s to sites-enabled, certbot --nginx -d santosh.example.com)
server {
    listen 80;
    server_name santosh.example.com;
    client_max_body_size 12m;

    location /api/conversations/ {
        proxy_pass http://127.0.0.1:8077;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # live updates (server-sent events) must not be buffered
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8077;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
