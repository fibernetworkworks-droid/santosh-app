version: 0.896.0+895
name: santosh
description: Santosh, your AI coworker. Android app for the Santosh Core backend.
publish_to: "none"

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # v0.491.0 the W4 flutter pass (curated pubspec upgrade, Dart 3.5.4 = CI's Flutter 3.24.5
  # ceiling; every constraint verified against pub.dev). Deferred majors + exact blockers:
  # flutter_local_notifications 18/19 need compileSdk 35 + a newer AGP; android_intent_plus 6.x
  # forces AGP 8.12/Gradle 8.13/Kotlin 2.2; file_picker 9-11 churn the API over 32 call sites;
  # flutter_timezone 5.x breaks the API for a localized name we never read; flutter_tts 4.2.x
  # demanded Android SDK 36 and speech_to_text 7.2+'s android gradle reads the 'flutter'
  # extension property a 3.24.5 gradle does not expose (both caught by the CI APK build,
  # both reverted); image_picker 1.2+ /
  # timezone 0.10+ / google_fonts 7+ / flutter_lints 6 / speech_to_text 7.5 all need Dart >3.5.4.
  http: ^1.6.0
  shared_preferences: ^2.5.3
  google_fonts: ^6.3.0
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  android_intent_plus: ^5.1.0
  speech_to_text: ^6.6.2
  flutter_tts: 4.0.2
  url_launcher: ^6.3.1
  file_picker: ^8.1.2
  webview_flutter: ^4.10.0
  video_player: ^2.9.5
  path_provider: ^2.1.5
  image_picker: ^1.1.2      # v0.88 camera photos of a phone at repair intake / delivery

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  # v0.461 the owner's own logo; v0.874 EK RANG: one solid colour - the white mark on Hoola violet.
  # The adaptive foreground is the white mark alone on transparent, inside the safe zone, and the
  # violet is the background colour - an adaptive icon is masked to a circle at ~66%.
  android: true
  ios: false
  image_path: assets/images/hoola_logo.png
  adaptive_icon_background: "#2A1C15"
  adaptive_icon_foreground: assets/images/hoola_logo_fg.png
  min_sdk_android: 23

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/santosh3d/
    - assets/avatars/
    - assets/fonts/          # v0.859 R0: the app's fonts bundled (tool/fetch_fonts.py) - no download, works offline
  # v0.860 R1: the redesign's three families (lib/ui/hoola_theme.dart HoolaFont), from the bundled files
  fonts:
    - family: Schibsted Grotesk
      fonts:
        - asset: assets/fonts/SchibstedGrotesk-Regular.ttf
        - asset: assets/fonts/SchibstedGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SchibstedGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SchibstedGrotesk-Bold.ttf
          weight: 700
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Regular.ttf
        - asset: assets/fonts/Literata-Italic.ttf
          style: italic
        - asset: assets/fonts/Literata-Medium.ttf
          weight: 500
        - asset: assets/fonts/Literata-SemiBold.ttf
          weight: 600
    # v0.892 CLAUDE KE AKSHAR: Literata cut at Claude's dark-mode weights (reply 360, bold 530) from the variable
    # Literata (OFL, opsz 12 like the static files) - dark replies read as light as Claude's
    - family: Literata Dark
      fonts:
        - asset: assets/fonts/LiterataDark-Regular.ttf
        - asset: assets/fonts/LiterataDark-Italic.ttf
          style: italic
        - asset: assets/fonts/LiterataDark-SemiBold.ttf
          weight: 600
    # v0.892 the Dyslexic-friendly chat font (OFL, assets/fonts/OpenDyslexic-OFL.txt)
    - family: OpenDyslexic
      fonts:
        - asset: assets/fonts/OpenDyslexic-Regular.otf
        - asset: assets/fonts/OpenDyslexic-Bold.otf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
